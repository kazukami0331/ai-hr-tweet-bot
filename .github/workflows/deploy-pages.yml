name: Deploy poker-range-checker to GitHub Pages

# NOTE: リポジトリの Settings → Pages → Source を「GitHub Actions」にすると動きます。
# Pages未有効のうちは自動実行で失敗し続けるため、手動実行(workflow_dispatch)のみにしています。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: poker-range-checker
      - id: deployment
        uses: actions/deploy-pages@v4
